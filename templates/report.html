<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目公共代码对比报告</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #fff; --border: #d0d7de; --text: #1f2328; --muted: #656d76;
    --hover: #f6f9fc; --sel: #ddf4ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 20px; flex-shrink: 0; }
  header h1 { margin: 0 0 2px; font-size: 17px; }
  header .meta { color: var(--muted); font-size: 11px; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 20px 0; flex-shrink: 0; align-items: stretch; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; min-width: 96px; }
  .card .num { font-size: 19px; font-weight: 700; line-height: 1.2; }
  .card .label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .card.overall { display: flex; flex-direction: column; justify-content: center; }
  .toolbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; flex-shrink: 0; }
  .toolbar input[type=text] { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; width: 280px; }
  .toolbar select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; }
  .toolbar .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  main { flex: 1; padding: 0 20px 14px; min-height: 0; display: flex; }
  .pane { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: auto; min-width: 0; }

  table.tree-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tree-table th { position: sticky; top: 0; background: #f0f2f5; z-index: 2; padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; white-space: nowrap; }
  table.tree-table td { padding: 4px 12px; border-bottom: 1px solid #f1f2f4; vertical-align: middle; }
  table.tree-table tr.row { cursor: pointer; }
  table.tree-table tr.row:hover td { background: var(--hover); }
  table.tree-table tr.dir td { background: #fafbfc; font-weight: 500; }
  table.tree-table tr.dir:hover td { background: #f0f4f8; }

  .name-cell { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chev { width: 13px; flex-shrink: 0; font-size: 9px; color: var(--muted); display: inline-block; transition: transform .12s; cursor: pointer; }
  .chev.open { transform: rotate(90deg); }
  .chev.leaf { visibility: hidden; }
  .name-cell .dot { flex-shrink: 0; }
  .name-cell .nm { overflow: hidden; text-overflow: ellipsis; }
  .name-cell .fcount { color: var(--muted); font-weight: 400; font-size: 11px; }
  td.side { font-family: Consolas, monospace; font-size: 12px; white-space: nowrap; }
  td.side .miss { color: #c0c4cc; }
  td.side .ok { color: var(--text); }
  td.stat { white-space: nowrap; }
  td.stat .aggline { color: var(--muted); font-size: 11px; font-family: Consolas, monospace; }
  td.sim { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .s-IDENTICAL { background: #1a7f37; }
  .s-SAME_BY_RENAME { background: #0e8a8a; }
  .s-SIMILAR { background: #bf8700; }
  .s-DIVERGED { background: #cf222e; }
  .s-ONLY_A, .s-ONLY_B { background: #8b949e; }
  .s-MIXED { background: linear-gradient(135deg,#1a7f37 0 50%, #cf222e 50% 100%); }

  .tag { display: inline-block; padding: 0 9px; border-radius: 10px; font-size: 11px; border: 1px solid var(--border); cursor: pointer; line-height: 18px; }
  .tag.t-IDENTICAL { background: #dafbe1; color: #1a7f37; border-color: #1a7f3733; }
  .tag.t-SAME_BY_RENAME { background: #ddf4ff; color: #0e8a8a; border-color: #0e8a8a33; }
  .tag.t-SIMILAR { background: #fff8c5; color: #9a6700; border-color: #bf870055; }
  .tag.t-DIVERGED { background: #ffebe9; color: #cf222e; border-color: #cf222e44; }
  .tag.t-ONLY_A, .tag.t-ONLY_B { background: #f0f1f2; color: #656d76; }
  .tag.t-MIXED { background: #fff8c5; color: #9a6700; border-color: #bf870055; cursor: default; }
  .tag.disabled { cursor: default; }

  .overlay { position: fixed; inset: 0; background: rgba(140,150,160,.45); display: none; z-index: 50; }
  .overlay.open { display: flex; align-items: stretch; justify-content: stretch; }
  .modal { background: var(--card); width: 100vw; height: 100vh; display: flex; flex-direction: column; }
  .modal-head { padding: 12px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; }
  .modal-head .title { font-weight: 700; font-size: 15px; font-family: Consolas, monospace; }
  .modal-head .info { margin-top: 6px; display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .modal-head .close { position: absolute; top: 8px; right: 12px; border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
  .modal-body { flex: 1; overflow: auto; }
  .diff-table { border-collapse: collapse; width: 100%; font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.55; }
  .diff-table th { position: sticky; top: 0; background: #f0f2f5; z-index: 2; padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; }
  .diff-table td { padding: 0 10px; vertical-align: top; white-space: pre-wrap; word-break: break-all; border-bottom: 1px solid #f0f1f2; }
  .diff-table td.c { width: 44%; }
  .diff-table td.ln { width: 46px; min-width: 46px; padding: 0 6px; color: #8b949e; background: #f6f8fa; user-select: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .diff-table td.ln-a { text-align: right; border-right: 1px solid var(--border); }
  .diff-table td.ln-b { text-align: left; }
  .diff-table td.l { background: #fff5f4; }
  .diff-table td.r { background: #f0fff4; }
  .diff-table td.empty { background: #fafbfc; }
  .diff-table th.ln-h { text-align: center; padding: 6px 6px; }
  .diff-table tr.hunk td { background: #ddf4ff; color: var(--muted); }
  .msg-box { margin: 30px auto; max-width: 560px; text-align: center; color: var(--muted); font-size: 14px; }
  .msg-box .big { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .msg-box .path { font-family: Consolas, monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin: 10px 0; word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>项目公共代码对比报告</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="cards" id="cards"></div>
<div class="toolbar">
  <input type="text" id="search" placeholder="搜索路径 / 文件名（支持 A、B 的真实路径）...">
  <select id="filter">
    <option value="all">全部文件</option>
    <option value="common">两边共有</option>
    <option value="diff" selected>有差异（漂移 + 差异大）</option>
    <option value="same">无差异（相同 + 仅改名）</option>
    <option value="only">仅单边独有</option>
  </select>
  <button id="expandAll" style="padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:12px">全部展开</button>
  <button id="collapseAll" style="padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:12px">全部折叠</button>
  <div class="legend">
    <span><span class="dot s-IDENTICAL"></span>完全相同</span>
    <span><span class="dot s-SAME_BY_RENAME"></span>仅项目名不同</span>
    <span><span class="dot s-SIMILAR"></span>相似(漂移)</span>
    <span><span class="dot s-DIVERGED"></span>差异较大</span>
    <span><span class="dot s-ONLY_A"></span><span class="dot s-ONLY_B"></span>单边独有</span>
    <span><span class="dot s-MIXED"></span>混合</span>
  </div>
  <div class="count" id="visCount"></div>
</div>
<main>
  <div class="pane">
    <table class="tree-table">
      <thead><tr>
        <th style="min-width:340px">名称</th>
        <th id="thA" style="min-width:130px">A</th>
        <th id="thB" style="min-width:130px">B</th>
        <th style="width:130px">状态</th>
        <th style="min-width:220px">相似度 / 统计</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <button class="close" id="closeBtn">&times;</button>
      <div class="title" id="modalTitle"></div>
      <div class="info" id="modalInfo"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
const NAME_A = DATA.meta.projectA, NAME_B = DATA.meta.projectB;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pct(v){return (v*100).toFixed(1)+'%';}
function kb(n){return n==null?'-':n<1024?n+' B':(n/1024).toFixed(1)+' KB';}
const STATUS_TEXT={
  IDENTICAL:'完全相同',SAME_BY_RENAME:'仅项目名不同',SIMILAR:'相似(漂移)',DIVERGED:'差异较大',
  ONLY_A:'仅 '+NAME_A,ONLY_B:'仅 '+NAME_B
};
const ALL_STATUS=['IDENTICAL','SAME_BY_RENAME','SIMILAR','DIVERGED','ONLY_A','ONLY_B'];

/* ---------- 合并树 ---------- */
function buildTree(){
  const root={name:'',path:'',dirs:new Map(),files:[],type:'dir'};
  for(const f of DATA.files){
    const parts=f.key.split('/');
    let node=root;
    for(let i=0;i<parts.length-1;i++){
      if(!node.dirs.has(parts[i])){
        node.dirs.set(parts[i],{name:parts[i],path:parts.slice(0,i+1).join('/'),dirs:new Map(),files:[],type:'dir'});
      }
      node=node.dirs.get(parts[i]);
    }
    node.files.push({name:parts[parts.length-1],path:f.key,type:'file',entry:f});
  }
  return root;
}
/** 目录聚合统计 */
function agg(node){
  const c={total:0,countA:0,countB:0};
  for(const k of ALL_STATUS) c[k]=0;
  for(const f of node.files){
    const s=f.entry.status; c.total++; c[s]++;
    if(f.entry.relA) c.countA++;
    if(f.entry.relB) c.countB++;
  }
  for(const d of node.dirs.values()){
    const s=agg(d);
    c.total+=s.total; c.countA+=s.countA; c.countB+=s.countB;
    for(const k of ALL_STATUS) c[k]+=s[k];
  }
  node.agg=c;
  return c;
}
/** 目录整体状态：有漂移/差异 → MIXED；否则按存在性归类 */
function dirStatus(c){
  if(c.SIMILAR||c.DIVERGED) return 'MIXED';
  if(c.ONLY_A&&c.ONLY_B) return 'MIXED';
  if(c.ONLY_A) return 'ONLY_A';
  if(c.ONLY_B) return 'ONLY_B';
  if(c.SAME_BY_RENAME) return 'SAME_BY_RENAME';
  return 'IDENTICAL';
}
function aggLine(c){
  const p=[];
  if(c.IDENTICAL) p.push('相同 '+c.IDENTICAL);
  if(c.SAME_BY_RENAME) p.push('改名 '+c.SAME_BY_RENAME);
  if(c.SIMILAR) p.push('漂移 '+c.SIMILAR);
  if(c.DIVERGED) p.push('差异 '+c.DIVERGED);
  if(c.ONLY_A) p.push('仅A '+c.ONLY_A);
  if(c.ONLY_B) p.push('仅B '+c.ONLY_B);
  return p.join(' · ')||'-';
}

const root=buildTree();
agg(root);
const state={ expanded:new Set(), search:'', filter:'diff' };
// 默认展开顶层模块目录
for(const d of root.dirs.values()) state.expanded.add(d.path);

/* ---------- 可见性 ---------- */
function matchesFilter(status){
  const m=state.filter;
  if(m==='all') return true;
  if(m==='common') return status!=='ONLY_A'&&status!=='ONLY_B';
  if(m==='diff') return status==='SIMILAR'||status==='DIVERGED';
  if(m==='same') return status==='IDENTICAL'||status==='SAME_BY_RENAME';
  if(m==='only') return status==='ONLY_A'||status==='ONLY_B';
  return true;
}
function fileVisible(f){
  if(!matchesFilter(f.entry.status)) return false;
  const q=state.search;
  if(!q) return true;
  return f.path.toLowerCase().includes(q)
    ||(f.entry.relA||'').toLowerCase().includes(q)
    ||(f.entry.relB||'').toLowerCase().includes(q);
}
function dirHasVisible(node){
  for(const f of node.files) if(fileVisible(f)) return true;
  for(const d of node.dirs.values()) if(dirHasVisible(d)) return true;
  return false;
}

/* ---------- 渲染 ---------- */
function render(){
  const out=[];
  let visFiles=0;
  function emit(node,depth){
    const dirs=[...node.dirs.values()].filter(dirHasVisible).sort((a,b)=>a.name.localeCompare(b.name));
    const files=node.files.filter(fileVisible).sort((a,b)=>a.name.localeCompare(b.name));
    for(const d of dirs){
      const c=d.agg, st=dirStatus(c), open=state.expanded.has(d.path);
      out.push(
        '<tr class="row dir" data-path="'+esc(d.path)+'" data-type="dir">'+
        '<td><div class="name-cell" style="padding-left:'+(depth*18)+'px">'+
          '<span class="chev'+(open?' open':'')+'">&#9654;</span>'+
          '<span class="dot s-'+st+'"></span><span class="nm">'+esc(d.name)+'</span>'+
          '<span class="fcount">'+c.total+'</span></div></td>'+
        '<td class="side"><span class="ok">'+c.countA+'</span></td>'+
        '<td class="side"><span class="ok">'+c.countB+'</span></td>'+
        '<td class="stat"><span class="tag t-'+st+' disabled">'+(st==='MIXED'?'有差异':STATUS_TEXT[st])+'</span></td>'+
        '<td class="sim">'+esc(aggLine(c))+'</td></tr>'
      );
      if(open) emit(d,depth+1);
    }
    for(const f of files){
      visFiles++;
      const e=f.entry;
      const aCell=e.relA?'<span class="ok" title="'+esc(e.relA)+'">'+kb(e.sizeA)+'</span>':'<span class="miss">—</span>';
      const bCell=e.relB?'<span class="ok" title="'+esc(e.relB)+'">'+kb(e.sizeB)+'</span>':'<span class="miss">—</span>';
      const clickable=(e.status==='SIMILAR'||e.status==='DIVERGED');
      const sim=e.similarity!=null?pct(e.similarity):'-';
      out.push(
        '<tr class="row" data-type="file" data-key="'+esc(e.key)+'">'+
        '<td><div class="name-cell" style="padding-left:'+(depth*18)+'px">'+
          '<span class="chev leaf"></span><span class="dot s-'+e.status+'"></span>'+
          '<span class="nm" title="'+esc(e.key)+'">'+esc(f.name)+'</span></div></td>'+
        '<td class="side">'+aCell+'</td>'+
        '<td class="side">'+bCell+'</td>'+
        '<td class="stat"><span class="tag t-'+e.status+(clickable?'':' disabled')+'" data-key="'+esc(e.key)+'">'+STATUS_TEXT[e.status]+'</span></td>'+
        '<td class="sim">'+sim+'</td></tr>'
      );
    }
  }
  emit(root,0);
  document.getElementById('tbody').innerHTML=out.join('');
  document.getElementById('visCount').textContent='显示 '+visFiles+' / '+DATA.files.length+' 个文件';
}

/* ---------- 交互 ---------- */
document.getElementById('tbody').addEventListener('click',(ev)=>{
  // 目录行：点击任意位置展开/折叠
  const dirRow=ev.target.closest('tr[data-type="dir"]');
  if(dirRow){
    const p=dirRow.getAttribute('data-path');
    if(state.expanded.has(p)) state.expanded.delete(p); else state.expanded.add(p);
    render();
    return;
  }
  // 文件行：点击任意位置打开弹窗
  const row=ev.target.closest('tr[data-type="file"]');
  if(row){
    const e=DATA.files.find(f=>f.key===row.getAttribute('data-key'));
    if(e) openModal(e);
  }
});
document.getElementById('expandAll').addEventListener('click',()=>{
  (function walk(n){for(const d of n.dirs.values()){state.expanded.add(d.path);walk(d);}})(root);
  render();
});
document.getElementById('collapseAll').addEventListener('click',()=>{ state.expanded.clear(); render(); });

let timer;
document.getElementById('search').addEventListener('input',(e)=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{
    state.search=e.target.value.trim().toLowerCase();
    // 搜索时自动展开命中路径的所有祖先
    if(state.search){
      (function walk(n){
        for(const d of n.dirs.values()){
          if(dirHasVisible(d)){ state.expanded.add(d.path); walk(d); }
        }
      })(root);
    }
    render();
  },200);
});
document.getElementById('filter').addEventListener('change',(e)=>{ state.filter=e.target.value; render(); });

/* ---------- 弹窗 ---------- */
function openModal(entry){
  document.getElementById('modalTitle').textContent=entry.key;
  const info=['<span class="tag t-'+entry.status+' disabled" style="cursor:default">'+STATUS_TEXT[entry.status]+'</span>'];
  if(entry.similarity!=null) info.push('相似度: <b>'+pct(entry.similarity)+'</b>');
  if(entry.linesA!=null) info.push('行数: A '+entry.linesA+' / B '+entry.linesB);
  info.push('大小: A '+kb(entry.sizeA)+' / B '+kb(entry.sizeB));
  if(entry.relA) info.push('A: '+esc(entry.relA));
  if(entry.relB) info.push('B: '+esc(entry.relB));
  document.getElementById('modalInfo').innerHTML=info.join('<span style="color:#d0d7de">|</span>');

  const body=document.getElementById('modalBody');
  if(entry.status==='IDENTICAL'){
    body.innerHTML='<div class="msg-box"><div class="big">字节级完全相同</div>该文件在两个项目中内容完全一致，可直接作为公共代码。</div>';
  }else if(entry.status==='SAME_BY_RENAME'){
    body.innerHTML='<div class="msg-box"><div class="big">仅项目名不同</div>将项目名（'+esc(NAME_A)+' / '+esc(NAME_B)+' 及其驼峰等形态）替换为占位符后，两边内容完全一致。<br>本质是公共代码，只是尚未参数化。</div>';
  }else if(entry.status==='ONLY_A'||entry.status==='ONLY_B'){
    const p=entry.status==='ONLY_A'?entry.relA:entry.relB;
    const proj=entry.status==='ONLY_A'?NAME_A:NAME_B;
    body.innerHTML='<div class="msg-box"><div class="big">仅存在于 '+esc(proj)+'</div>该文件在另一个项目中没有同路径对应文件（业务代码），不做差异对比。<div class="path">'+esc(p)+'</div></div>';
  }else if(entry.diff){
    body.innerHTML=renderDiffTable(entry.diff,NAME_A,NAME_B);
  }else{
    body.innerHTML='<div class="msg-box"><div class="big">无 diff 数据</div>文件过大，未生成逐行对比。</div>';
  }
  document.getElementById('overlay').classList.add('open');
}
function renderDiffTable(diffText,nameA,nameB){
  const rows=[];
  let aNum=null,bNum=null;
  for(const line of diffText.split('\n')){
    if(line.startsWith('--- ')||line.startsWith('+++ ')) continue;
    if(line.startsWith('@@')){
      // 解析 @@ -aStart,aCount +bStart,bCount @@ 以初始化两侧起始行号
      const m=/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
      aNum=m?parseInt(m[1],10):null;
      bNum=m?parseInt(m[2],10):null;
      rows.push('<tr class="hunk"><td colspan="4">'+esc(line)+'</td></tr>');
      continue;
    }
    const isDel=line.startsWith('-');
    const isAdd=line.startsWith('+');
    const body=esc(line.startsWith(' ')||isDel||isAdd?line.slice(1):line);
    const aCell=isAdd?'<td class="l c empty"></td>':'<td class="l c">'+body+'</td>';
    const bCell=isDel?'<td class="r c empty"></td>':'<td class="r c">'+body+'</td>';
    const aLn='<td class="ln ln-a">'+(isAdd||aNum==null?'':aNum)+'</td>';
    const bLn='<td class="ln ln-b">'+(isDel||bNum==null?'':bNum)+'</td>';
    // 行号列居中并列：A内容 | A行号 | B行号 | B内容，便于左右对照
    rows.push('<tr>'+aCell+aLn+bLn+bCell+'</tr>');
    if(!isAdd&&aNum!=null) aNum++;
    if(!isDel&&bNum!=null) bNum++;
  }
  return '<table class="diff-table"><thead><tr>'
    +'<th>'+esc(nameA)+' (A)</th><th class="ln-h"></th><th class="ln-h"></th>'
    +'<th>'+esc(nameB)+' (B)</th>'
    +'</tr></thead><tbody>'+rows.join('')+'</tbody></table>';
}
document.getElementById('closeBtn').addEventListener('click',()=>document.getElementById('overlay').classList.remove('open'));
document.getElementById('overlay').addEventListener('click',(e)=>{ if(e.target===e.currentTarget) e.currentTarget.classList.remove('open'); });
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') document.getElementById('overlay').classList.remove('open'); });

/* ---------- 顶部 ---------- */
(function top(){
  const s=DATA.summary;
  const items=[
    ['共有文件',s.common],['完全相同',s.identical],['仅项目名不同',s.sameByRename],
    ['相似(漂移)',s.similar],['差异较大',s.diverged],
    ['仅 '+NAME_A,s.onlyA],['仅 '+NAME_B,s.onlyB]
  ];
  document.getElementById('cards').innerHTML=items.map(([l,n])=>
    '<div class="card"><div class="num">'+n+'</div><div class="label">'+esc(l)+'</div></div>').join('');
  document.getElementById('thA').textContent=NAME_A;
  document.getElementById('thB').textContent=NAME_B;
  document.getElementById('meta').textContent=
    NAME_A+' ('+DATA.meta.dirA+')  ↔  '+NAME_B+' ('+DATA.meta.dirB+')    生成：'+DATA.meta.generatedAt+
    (DATA.meta.excludePatterns&&DATA.meta.excludePatterns.length
      ? '    已排除 '+DATA.meta.excludedCount+' 个文件：'+DATA.meta.excludePatterns.join(' , ') : '');
})();

render();
</script>
</body>
</html>
