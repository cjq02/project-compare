<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目公共代码对比报告</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #fff; --border: #d0d7de; --text: #1f2328; --muted: #656d76;
    --hover: #f6f9fc; --sel: #ddf4ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 20px; flex-shrink: 0; }
  header h1 { margin: 0 0 2px; font-size: 17px; }
  header .meta { color: var(--muted); font-size: 11px; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 20px 0; flex-shrink: 0; align-items: stretch; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; min-width: 96px; }
  .card .num { font-size: 19px; font-weight: 700; line-height: 1.2; }
  .card .label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .card.overall { display: flex; flex-direction: column; justify-content: center; }
  .toolbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; flex-shrink: 0; }
  .toolbar input[type=text] { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; width: 280px; }
  .toolbar select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  main { flex: 1; padding: 0 20px 14px; min-height: 0; display: flex; }
  .pane { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
  .pane-bar { display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: #fafbfc; }
  .pane-title { font-weight: 600; font-size: 13px; }
  .pane-bar .count { color: var(--muted); font-size: 12px; }
  .pane-actions { margin-left: auto; display: flex; gap: 6px; }
  .tbtn { padding: 3px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; color: var(--text); }
  .tbtn:hover { background: var(--hover); }
  .pane-scroll { overflow: auto; flex: 1; }

  table.tree-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tree-table th { position: sticky; top: 0; background: #f0f2f5; z-index: 2; padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; white-space: nowrap; }
  table.tree-table td { padding: 4px 12px; border-bottom: 1px solid #f1f2f4; vertical-align: middle; }
  table.tree-table tr.row { cursor: pointer; }
  table.tree-table tr.row:hover td { background: var(--hover); }
  table.tree-table tr.dir td { background: #fafbfc; font-weight: 500; }
  table.tree-table tr.dir:hover td { background: #f0f4f8; }

  .name-cell { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chev { width: 13px; flex-shrink: 0; font-size: 9px; color: var(--muted); display: inline-block; transition: transform .12s; cursor: pointer; }
  .chev.open { transform: rotate(90deg); }
  .chev.leaf { visibility: hidden; }
  .name-cell .dot { flex-shrink: 0; }
  .name-cell .nm { overflow: hidden; text-overflow: ellipsis; }
  .name-cell .fcount { color: var(--muted); font-weight: 400; font-size: 11px; }
  .name-cell .fcount .fcommon { color: #0969da; }
  td.side { font-family: Consolas, monospace; font-size: 12px; white-space: nowrap; }
  td.side .miss { color: #c0c4cc; }
  td.side .ok { color: var(--text); }
  td.stat { white-space: nowrap; }
  td.stat .aggline { color: var(--muted); font-size: 11px; font-family: Consolas, monospace; }
  td.sim { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .subact { display: none; gap: 8px; flex-shrink: 0; }
  tr.dir:hover .subact { display: inline-flex; }
  .subact a { color: #0969da; cursor: pointer; font-size: 11px; white-space: nowrap; }
  .subact a:hover { text-decoration: underline; }
  .subact a.off { color: #c0c4cc; cursor: default; }
  .subact a.off:hover { text-decoration: none; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .s-IDENTICAL { background: #1a7f37; }
  .s-SAME_BY_RENAME { background: #0e8a8a; }
  .s-SIMILAR { background: #bf8700; }
  .s-DIVERGED { background: #cf222e; }
  .s-ONLY_A, .s-ONLY_B { background: #8b949e; }
  .s-MIXED { background: linear-gradient(135deg,#1a7f37 0 50%, #cf222e 50% 100%); }

  .tag { display: inline-block; padding: 0 9px; border-radius: 10px; font-size: 11px; border: 1px solid var(--border); cursor: pointer; line-height: 18px; }
  .tag.t-IDENTICAL { background: #dafbe1; color: #1a7f37; border-color: #1a7f3733; }
  .tag.t-SAME_BY_RENAME { background: #ddf4ff; color: #0e8a8a; border-color: #0e8a8a33; }
  .tag.t-SIMILAR { background: #fff8c5; color: #9a6700; border-color: #bf870055; }
  .tag.t-DIVERGED { background: #ffebe9; color: #cf222e; border-color: #cf222e44; }
  .tag.t-ONLY_A, .tag.t-ONLY_B { background: #f0f1f2; color: #656d76; }
  .tag.t-MIXED { background: #fff8c5; color: #9a6700; border-color: #bf870055; cursor: default; }
  .tag.disabled { cursor: default; }

  .overlay { position: fixed; inset: 0; background: rgba(140,150,160,.45); display: none; z-index: 50; }
  .overlay.open { display: flex; align-items: stretch; justify-content: stretch; }
  .modal { background: var(--card); width: 100vw; height: 100vh; display: flex; flex-direction: column; }
  .modal-head { padding: 12px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; }
  .modal-head .title { font-weight: 700; font-size: 15px; font-family: Consolas, monospace; }
  .modal-head .info { margin-top: 6px; display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .modal-head .close { position: absolute; top: 8px; right: 12px; border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
  .view-toggle { margin-top: 8px; display: flex; gap: 6px; }
  .vbtn { padding: 3px 12px; border: 1px solid var(--border); background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--text); }
  .vbtn:hover { background: var(--hover); }
  .vbtn.on { background: #0969da; color: #fff; border-color: #0969da; }
  .vbtn.on:hover { background: #0969da; }
  .trunc-note { padding: 8px 12px; background: #fff8c5; color: #9a6700; font-size: 12px; border-bottom: 1px solid var(--border); }

  /* 同步条 */
  .sync-bar { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sync-label { font-size: 12px; color: var(--muted); }
  .sync-bar select { padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
  .sbtn { padding: 3px 12px; border: 1px solid var(--border); background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--text); }
  .sbtn:hover { background: var(--hover); }
  .sbtn:disabled { cursor: default; color: #c0c4cc; background: #fff; }
  .sbtn.danger { background: #cf222e; color: #fff; border-color: #cf222e; }
  .sbtn.danger:hover { background: #a40e26; }
  .sbtn.ghost { background: transparent; }
  .sync-confirm { display: flex; align-items: center; gap: 8px; }
  .sync-path { font-family: Consolas, monospace; font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; word-break: break-all; }
  .sync-msg { font-size: 12px; }
  .sync-msg.ok { color: #1a7f37; }
  .sync-msg.err { color: #cf222e; }

  /* 实时提示条 */
  .livebar { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; align-items: center; gap: 10px;
    background: #24292f; color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 6px 24px rgba(0,0,0,.28); }
  .livebar .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #d4a72c; flex-shrink: 0; }
  .livebar .sbtn { background: #fff; border-color: #fff; }
  .livebar .sbtn.ghost { background: transparent; color: #fff; border-color: #6e7681; }
  .modal-body { flex: 1; overflow: auto; }
  .diff-table { border-collapse: collapse; width: 100%; font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.55; }
  .diff-table th { position: sticky; top: 0; background: #f0f2f5; z-index: 2; padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; }
  .diff-table td { padding: 0 10px; vertical-align: top; white-space: pre-wrap; word-break: break-all; border-bottom: 1px solid #f0f1f2; }
  .diff-table td.c { width: 44%; }
  .diff-table td.ln { width: 46px; min-width: 46px; padding: 0 6px; color: #8b949e; background: #f6f8fa; user-select: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .diff-table td.ln-a { text-align: right; border-right: 1px solid var(--border); }
  .diff-table td.ln-b { text-align: left; }
  .diff-table td.l { background: #fff5f4; }
  .diff-table td.r { background: #f0fff4; }
  .diff-table td.empty { background: #fafbfc; }
  .diff-table th.ln-h { text-align: center; padding: 6px 6px; }
  .diff-table tr.hunk td { background: #ddf4ff; color: var(--muted); }
  .msg-box { margin: 30px auto; max-width: 560px; text-align: center; color: var(--muted); font-size: 14px; }
  .msg-box .big { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .msg-box .path { font-family: Consolas, monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin: 10px 0; word-break: break-all; }
  /* ---------- 行提示 / IDE 对比 ---------- */
  .noise { color: #8250df; font-size: 11px; }
  .pane-hint { font-size: 11.5px; color: var(--muted); }
  .ide-open { white-space: nowrap; border-color: #0969da; color: #0969da; font-weight: 600; }
  .ide-open:hover { background: #0969da; color: #fff; }
  tr[data-type="file"] { cursor: pointer; }

  /* ---------- 右键菜单 ---------- */
  .ctxmenu {
    position: fixed; z-index: 90; min-width: 210px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 4px;
    box-shadow: 0 8px 24px rgba(140, 149, 159, .28);
  }
  .ctxmenu .ci {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border-radius: 5px; font-size: 12.5px; cursor: pointer; color: var(--text);
    white-space: nowrap;
  }
  .ctxmenu .ci:hover { background: var(--hover); }
  .ctxmenu .ci.off { opacity: .4; cursor: not-allowed; }
  .ctxmenu .ci.off:hover { background: transparent; }
  .ctxmenu .ci .k { margin-left: auto; color: var(--muted); font-size: 11px; }
  .ctxmenu .ci.primary { font-weight: 600; color: #0969da; }
  .ctxmenu .sep { height: 1px; background: var(--border); margin: 4px 6px; }
  .ctxmenu .head { padding: 5px 10px 3px; font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    z-index: 120; padding: 9px 18px; border-radius: 8px; font-size: 13px;
    background: #1f2328; color: #fff; box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    max-width: 74vw; word-break: break-all;
  }
  .toast.ok { background: #1a7f37; }
  .toast.err { background: #cf222e; }
</style>
</head>
<body>
<header>
  <h1>项目公共代码对比报告</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="cards" id="cards"></div>
<div class="toolbar">
  <input type="text" id="search" placeholder="搜索路径 / 文件名（支持 A、B 的真实路径）...">
  <select id="filter">
    <option value="all">全部文件</option>
    <option value="common">两边共有</option>
    <option value="diff" selected>有差异（漂移 + 差异大）</option>
    <option value="same">无差异（相同 + 仅改名）</option>
    <option value="only">仅单边独有</option>
  </select>
  <div class="legend">
    <span><span class="dot s-IDENTICAL"></span>完全相同</span>
    <span><span class="dot s-SAME_BY_RENAME"></span>仅项目名不同</span>
    <span><span class="dot s-SIMILAR"></span>相似(漂移)</span>
    <span><span class="dot s-DIVERGED"></span>差异较大</span>
    <span><span class="dot s-ONLY_A"></span><span class="dot s-ONLY_B"></span>单边独有</span>
    <span><span class="dot s-MIXED"></span>混合</span>
  </div>
</div>
<main>
  <div class="pane">
    <div class="pane-bar">
      <span class="pane-title">对比结果</span>
      <span class="count" id="visCount"></span>
      <span class="pane-hint" id="paneHint">单击文件行 → 打开 IDE 对比 · 右键 → 详情与同步</span>
      <span class="pane-actions">
        <button class="tbtn" id="expandAll">全部展开</button>
        <button class="tbtn" id="collapseAll">全部折叠</button>
      </span>
    </div>
    <div class="pane-scroll">
      <table class="tree-table">
        <thead><tr>
          <th style="min-width:340px">名称</th>
          <th id="thA" style="min-width:130px">A</th>
          <th id="thB" style="min-width:130px">B</th>
          <th style="width:130px">状态</th>
          <th style="min-width:220px">相似度 / 统计</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <button class="close" id="closeBtn">&times;</button>
      <div class="title" id="modalTitle"></div>
      <div class="info" id="modalInfo"></div>
      <button class="tbtn ide-open" id="ideOpen" style="display:none" title="用 IDE 自带的对比窗口打开这两个文件">在 IDE 中对比</button>
      <div class="view-toggle" id="viewToggle" style="display:none"></div>
      <div class="sync-bar" id="syncBar" style="display:none">
        <span class="sync-label">同步此文件</span>
        <span id="syncMain">
          <select id="syncDir">
            <option value="A2B">A → B</option>
            <option value="B2A">B → A</option>
          </select>
          <button class="sbtn" id="syncBtn">预览</button>
        </span>
        <span class="sync-confirm" id="syncConfirm" style="display:none">
          <span class="sync-path" id="syncPath"></span>
          <button class="sbtn danger" id="syncOk">确认执行</button>
          <button class="sbtn" id="syncCancel">取消</button>
        </span>
        <span class="sync-msg" id="syncMsg"></span>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="livebar" id="livebar" style="display:none">
  <span class="live-dot"></span>
  <span id="liveText">项目有变更</span>
  <button class="sbtn" id="liveRefresh">重新对比并刷新</button>
  <button class="sbtn ghost" id="liveClose">忽略</button>
</div>
<div class="ctxmenu" id="ctxmenu" style="display:none"></div>
<div class="toast" id="toast" style="display:none"></div>
<script>
const DATA = /*__DATA__*/null;
const NAME_A = DATA.meta.projectA, NAME_B = DATA.meta.projectB;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pct(v){return (v*100).toFixed(1)+'%';}
function kb(n){return n==null?'-':n<1024?n+' B':(n/1024).toFixed(1)+' KB';}
const STATUS_TEXT={
  IDENTICAL:'完全相同',SAME_BY_RENAME:'仅项目名不同',SIMILAR:'相似(漂移)',DIVERGED:'差异较大',
  ONLY_A:'仅 '+NAME_A,ONLY_B:'仅 '+NAME_B
};
const ALL_STATUS=['IDENTICAL','SAME_BY_RENAME','SIMILAR','DIVERGED','ONLY_A','ONLY_B'];

/* ---------- 合并树 ---------- */
/** path -> 目录节点，供子树递归展开/折叠时定位 */
const nodeIndex=new Map();
function buildTree(){
  const root={name:'',path:'',dirs:new Map(),files:[],type:'dir'};
  for(const f of DATA.files){
    const parts=f.key.split('/');
    let node=root;
    for(let i=0;i<parts.length-1;i++){
      if(!node.dirs.has(parts[i])){
        const p=parts.slice(0,i+1).join('/');
        const child={name:parts[i],path:p,dirs:new Map(),files:[],type:'dir'};
        node.dirs.set(parts[i],child);
        nodeIndex.set(p,child);
      }
      node=node.dirs.get(parts[i]);
    }
    node.files.push({name:parts[parts.length-1],path:f.key,type:'file',entry:f});
  }
  return root;
}
/** 目录聚合统计 */
function agg(node){
  const c={total:0,common:0,countA:0,countB:0};
  for(const k of ALL_STATUS) c[k]=0;
  for(const f of node.files){
    const s=f.entry.status; c.total++; c[s]++;
    if(f.entry.relA) c.countA++;
    if(f.entry.relB) c.countB++;
    if(f.entry.relA&&f.entry.relB) c.common++;
  }
  for(const d of node.dirs.values()){
    const s=agg(d);
    c.total+=s.total; c.common+=s.common; c.countA+=s.countA; c.countB+=s.countB;
    for(const k of ALL_STATUS) c[k]+=s[k];
  }
  node.agg=c;
  return c;
}
/** 目录整体状态：有漂移/差异 → MIXED；否则按存在性归类 */
function dirStatus(c){
  if(c.SIMILAR||c.DIVERGED) return 'MIXED';
  if(c.ONLY_A&&c.ONLY_B) return 'MIXED';
  if(c.ONLY_A) return 'ONLY_A';
  if(c.ONLY_B) return 'ONLY_B';
  if(c.SAME_BY_RENAME) return 'SAME_BY_RENAME';
  return 'IDENTICAL';
}
function aggLine(c){
  const p=[];
  if(c.IDENTICAL) p.push('相同 '+c.IDENTICAL);
  if(c.SAME_BY_RENAME) p.push('改名 '+c.SAME_BY_RENAME);
  if(c.SIMILAR) p.push('漂移 '+c.SIMILAR);
  if(c.DIVERGED) p.push('差异 '+c.DIVERGED);
  if(c.ONLY_A) p.push('仅A '+c.ONLY_A);
  if(c.ONLY_B) p.push('仅B '+c.ONLY_B);
  return p.join(' · ')||'-';
}

const root=buildTree();
agg(root);
const state={ expanded:new Set(), search:'', filter:'diff' };
// 默认展开顶层模块目录
for(const d of root.dirs.values()) state.expanded.add(d.path);

/* ---------- 可见性 ---------- */
function matchesFilter(status){
  const m=state.filter;
  if(m==='all') return true;
  if(m==='common') return status!=='ONLY_A'&&status!=='ONLY_B';
  if(m==='diff') return status==='SIMILAR'||status==='DIVERGED';
  if(m==='same') return status==='IDENTICAL'||status==='SAME_BY_RENAME';
  if(m==='only') return status==='ONLY_A'||status==='ONLY_B';
  return true;
}
function fileVisible(f){
  if(!matchesFilter(f.entry.status)) return false;
  const q=state.search;
  if(!q) return true;
  return f.path.toLowerCase().includes(q)
    ||(f.entry.relA||'').toLowerCase().includes(q)
    ||(f.entry.relB||'').toLowerCase().includes(q);
}
function dirHasVisible(node){
  for(const f of node.files) if(fileVisible(f)) return true;
  for(const d of node.dirs.values()) if(dirHasVisible(d)) return true;
  return false;
}

/* ---------- 渲染 ---------- */
function render(){
  const out=[];
  let visFiles=0;
  function emit(node,depth){
    const dirs=[...node.dirs.values()].filter(dirHasVisible).sort((a,b)=>a.name.localeCompare(b.name));
    const files=node.files.filter(fileVisible).sort((a,b)=>a.name.localeCompare(b.name));
    for(const d of dirs){
      const c=d.agg, st=dirStatus(c), open=state.expanded.has(d.path);
      out.push(
        '<tr class="row dir" data-path="'+esc(d.path)+'" data-type="dir">'+
        '<td><div class="name-cell" style="padding-left:'+(depth*18)+'px">'+
          '<span class="chev'+(open?' open':'')+'">&#9654;</span>'+
          '<span class="dot s-'+st+'"></span><span class="nm">'+esc(d.name)+'</span>'+
          '<span class="fcount" title="总数 '+c.total+'（含单边独有）· 共有 '+c.common+'（两侧都存在，参与对比）">'+c.total+'<span class="fcommon">('+c.common+')</span></span>'
          +subactHtml(d)+'</div></td>'+
        '<td class="side"><span class="ok">'+c.countA+'</span></td>'+
        '<td class="side"><span class="ok">'+c.countB+'</span></td>'+
        '<td class="stat"><span class="tag t-'+st+' disabled">'+(st==='MIXED'?'有差异':STATUS_TEXT[st])+'</span></td>'+
        '<td class="sim">'+esc(aggLine(c))+'</td></tr>'
      );
      if(open) emit(d,depth+1);
    }
    for(const f of files){
      visFiles++;
      const e=f.entry;
      const aCell=e.relA?'<span class="ok" title="'+esc(e.relA)+'">'+kb(e.sizeA)+'</span>':'<span class="miss">—</span>';
      const bCell=e.relB?'<span class="ok" title="'+esc(e.relB)+'">'+kb(e.sizeB)+'</span>':'<span class="miss">—</span>';
      const clickable=(e.status==='SIMILAR'||e.status==='DIVERGED');
      const sim=e.similarity!=null?pct(e.similarity)
        :(e.noiseOnly?'<span class="noise" title="内容一致；原始字节不同，差异仅在 BOM / 换行风格">仅 BOM/换行</span>':'-');
      out.push(
        '<tr class="row" data-type="file" data-key="'+esc(e.key)+'">'+
        '<td><div class="name-cell" style="padding-left:'+(depth*18)+'px">'+
          '<span class="chev leaf"></span><span class="dot s-'+e.status+'"></span>'+
          '<span class="nm" title="'+esc(e.key)+'">'+esc(f.name)+'</span></div></td>'+
        '<td class="side">'+aCell+'</td>'+
        '<td class="side">'+bCell+'</td>'+
        '<td class="stat"><span class="tag t-'+e.status+(clickable?'':' disabled')+'" data-key="'+esc(e.key)+'">'+STATUS_TEXT[e.status]+'</span></td>'+
        '<td class="sim">'+sim+'</td></tr>'
      );
    }
  }
  emit(root,0);
  document.getElementById('tbody').innerHTML=out.join('');
  document.getElementById('visCount').textContent='显示 '+visFiles+' / '+DATA.files.length+' 个文件';
}

/* IDE 工具清单由服务端探测后注入；file:// 直接打开时取不到，保持 default='none' 走弹窗 */
let DIFF_TOOLS={ default:'none', tools:{} };
let _toastTimer=null;
function toast(msg, kind){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast'+(kind?' '+kind:'');
  el.style.display='';
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{ el.style.display='none'; }, kind==='err'?5200:2600);
}

function canIdeDiff(e){
  if(!e||!e.relA||!e.relB) return false;
  const t=DIFF_TOOLS.default;
  return t!=='none' && !!(DIFF_TOOLS.tools[t]&&DIFF_TOOLS.tools[t].available);
}

/** 调用服务端拉起 IDE 的 diff 窗口 */
async function openIdeDiff(e, tool){
  tool=tool||DIFF_TOOLS.default;
  try{
    const res=await fetch('/api/open-diff',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({key:e.key, tool}),
    });
    const o=await res.json();
    if(!o.ok){ toast(o.error||'打开失败','err'); return false; }
    toast('已在 '+o.label+' 中打开对比','ok');
    return true;
  }catch(err){ toast('服务不可用：'+err.message,'err'); return false; }
}

async function copyText(t){
  try{
    if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(t); }
    else{
      const ta=document.createElement('textarea');
      ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('已复制: '+t,'ok');
  }catch(err){ toast('复制失败: '+err.message,'err'); }
}

function updateIdeHint(){
  const el=document.getElementById('paneHint');
  const t=DIFF_TOOLS.default;
  const info=t==='none'?null:DIFF_TOOLS.tools[t];
  if(!info||!info.available) el.textContent='单击文件行 → 打开详情弹窗';
  else el.textContent='单击文件行 → 在 '+info.label+' 中对比 · 右键 → 详情与同步';
}
fetch('/api/diff-tools').then(r=>r.json()).then(o=>{
  if(o&&o.ok){ DIFF_TOOLS={ default:o.default||'none', tools:o.tools||{} }; updateIdeHint(); }
}).catch(()=>{ /* file:// 或服务未启动：维持 none */ });

/** 递归展开某目录及其全部子目录 */
function expandSubtree(path){
  const node=nodeIndex.get(path);
  if(!node) return;
  // 自身必须一并展开：emit 只在该目录 open 时才渲染子行，
  // 只标记后代而不展开自身，等于什么都不会显示
  state.expanded.add(path);
  (function walk(n){ for(const d of n.dirs.values()){ state.expanded.add(d.path); walk(d); } })(node);
  render();
}
/** 递归折叠某目录的全部子目录；自身保持展开以便看到折叠结果 */
function collapseSubtree(path){
  const node=nodeIndex.get(path);
  if(!node) return;
  state.expanded.add(path);   // 自身收着的话，折叠结果同样不可见
  (function walk(n){ for(const d of n.dirs.values()){ state.expanded.delete(d.path); walk(d); } })(node);
  render();
}
/** 子树中目录总数与已展开数 */
function subtreeStats(node){
  let total=0, opened=0;
  (function walk(n){ for(const d of n.dirs.values()){ total++; if(state.expanded.has(d.path)) opened++; walk(d); } })(node);
  return { total, opened };
}
/** 目录行的局部展开/折叠按钮；无可操作项时置灰，避免点击后毫无反馈 */
function subactHtml(d){
  if(!d.dirs.size) return '';
  const s=subtreeStats(d);
  const canExp=s.opened<s.total, canCol=s.opened>0;
  return '<span class="subact">'
    +'<a data-exp="'+esc(d.path)+'" class="'+(canExp?'':'off')+'"'
      +' title="展开全部 '+s.total+' 个子目录（已展开 '+s.opened+'）">全部展开</a>'
    +'<a data-col="'+esc(d.path)+'" class="'+(canCol?'':'off')+'"'
      +' title="折叠全部 '+s.opened+' 个已展开子目录">全部折叠</a>'
    +'</span>';
}

/** 信息栏；标明数据来源是实时还是报告快照 */
function renderModalInfo(){
  const e=modalEntry, s=modalSrc();

  const info=['<span class="tag t-'+s.status+' disabled" style="cursor:default">'+STATUS_TEXT[s.status]+'</span>'];
  if(s.similarity!=null) info.push('相似度: <b>'+pct(s.similarity)+'</b>');

    : '内容: 快照 '+esc(String(DATA.meta.generatedAt||'').slice(0,19).replace('T',' ')));

/** 现读磁盘取最新对比；取不到（file:// 或服务不可用）则维持快照 */
async function fetchLiveDiff(){
  const e=modalEntry;
  if(!e||!e.relA||!e.relB) return;   // 单边独有文件没有对比意义
  try{
    const res=await fetch('/api/live-diff?key='+encodeURIComponent(e.key));
    const o=await res.json();
    if(!o.ok) return;
    if(modalEntry!==e) return;        // 期间已切到别的文件，丢弃
    modalLive=o;
    renderModalInfo();
    renderModalView();

/** 按当前视图模式渲染弹窗主体（完整内容 / 仅看差异） */
function renderModalView(){
  const e=modalEntry;
  const s=modalSrc();          // 实时数据优先，快照兜底
  const body=document.getElementById('modalBody');
  const toggle=document.getElementById('viewToggle');
  if(!e||!s){ body.innerHTML=''; toggle.style.display='none'; return; }
  const canFull=!!s.fullDiff;
  const canDiff=!!s.diff;
  // 只有既有正文又有 diff 的才提供切换
  if(canFull&&canDiff){
    toggle.innerHTML='<button class="vbtn'+(modalView==='full'?' on':'')+'" data-v="full">完整内容</button>'
      +'<button class="vbtn'+(modalView==='diff'?' on':'')+'" data-v="diff">仅看差异</button>';
    toggle.style.display='';
  }else{
    toggle.innerHTML='';
    toggle.style.display='none';
  }
  if(s.status==='IDENTICAL'){
    if(s.noiseOnly){
      body.innerHTML='<div class="msg-box"><div class="big">内容完全相同</div>'
        +'去掉 UTF-8 BOM 与换行风格（CRLF / LF）差异后，两边内容完全一致，可直接作为公共代码。'
        +'<div class="path">原始字节并不相同：A '+kb(s.sizeA)+' / B '+kb(s.sizeB)+
        '，差的就是 BOM 与换行符本身，不涉及代码。</div></div>';
    }else{
      body.innerHTML='<div class="msg-box"><div class="big">字节级完全相同</div>该文件在两个项目中内容完全一致，可直接作为公共代码。</div>';
    }
  }else if(s.status==='SAME_BY_RENAME'){
    body.innerHTML='<div class="msg-box"><div class="big">仅项目名不同</div>将项目名（'+esc(NAME_A)+' / '+esc(NAME_B)+' 及其驼峰等形态）替换为占位符后，两边内容完全一致。<br>本质是公共代码，只是尚未参数化。</div>';
  }else if(s.status==='ONLY_A'||s.status==='ONLY_B'){
    const p=s.status==='ONLY_A'?e.relA:e.relB;
    const proj=s.status==='ONLY_A'?NAME_A:NAME_B;
    body.innerHTML='<div class="msg-box"><div class="big">仅存在于 '+esc(proj)+'</div>该文件在另一个项目中没有同路径对应文件（业务代码），不做差异对比。<div class="path">'+esc(p)+'</div></div>';
  }else if(modalView==='full'&&canFull){
    body.innerHTML=renderFullContent(s);
  }else if(canDiff){
    body.innerHTML=renderDiffTable(s.diff,NAME_A,NAME_B);
  }else{
    body.innerHTML='<div class="msg-box"><div class="big">无对比数据</div>文件过大，未生成逐行对比。</div>';
  }
}

/** 完整内容视图：完整上下文的对齐 diff —— 全部行可见，且改动行标红绿 */
function renderFullContent(entry){
  let note='';
  if(entry.fullDiff.indexOf('已截断')>-1){
    note='<div class="trunc-note">文件过大，完整内容视图已按行数上限截断，只显示前若干段。</div>';
  }
  return note+renderDiffTable(entry.fullDiff,NAME_A,NAME_B);
}
function renderDiffTable(diffText,nameA,nameB){
  const rows=[];
  let aNum=null,bNum=null;
  for(const line of diffText.split('\n')){
    if(line.startsWith('--- ')||line.startsWith('+++ ')) continue;
    if(line.startsWith('@@')){
      // 解析 @@ -aStart,aCount +bStart,bCount @@ 以初始化两侧起始行号
      const m=/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
      aNum=m?parseInt(m[1],10):null;
      bNum=m?parseInt(m[2],10):null;
      rows.push('<tr class="hunk"><td colspan="4">'+esc(line)+'</td></tr>');
      continue;
    }
    const isDel=line.startsWith('-');
    const isAdd=line.startsWith('+');
    const body=esc(line.startsWith(' ')||isDel||isAdd?line.slice(1):line);
    const aCell=isAdd?'<td class="l c empty"></td>':'<td class="l c">'+body+'</td>';
    const bCell=isDel?'<td class="r c empty"></td>':'<td class="r c">'+body+'</td>';
    const aLn='<td class="ln ln-a">'+(isAdd||aNum==null?'':aNum)+'</td>';
    const bLn='<td class="ln ln-b">'+(isDel||bNum==null?'':bNum)+'</td>';
    // 行号列居中并列：A内容 | A行号 | B行号 | B内容，便于左右对照
    rows.push('<tr>'+aCell+aLn+bLn+bCell+'</tr>');
    if(!isAdd&&aNum!=null) aNum++;
    if(!isDel&&bNum!=null) bNum++;
  }
  return '<table class="diff-table"><thead><tr>'
    +'<th>'+esc(nameA)+' (A)</th><th class="ln-h"></th><th class="ln-h"></th>'
    +'<th>'+esc(nameB)+' (B)</th>'
    +'</tr></thead><tbody>'+rows.join('')+'</tbody></table>';
}

});
// 仅在通过服务访问时连接 SSE；file:// 直接打开时跳过（同步按钮也会提示不可用）
if(location.protocol==='http:'||location.protocol==='https:'){
  try{
    const es=new EventSource('/api/events');
    es.onmessage=(ev)=>{
      let o={}; try{o=JSON.parse(ev.data);}catch(e){return;}
      if(o.type==='changed') showLive(o.reason==='sync'?'文件已同步，报告已过期':'项目文件有变更');
      else if(o.type==='error') showLive('对比失败：'+(o.message||''));
    };
    // 断线由 EventSource 自动重连
  }catch(e){ /* 忽略 */ }
}

/* ---------- 顶部 ---------- */
(function top(){
  const s=DATA.summary;
  const items=[
    ['共有文件',s.common],['完全相同',s.identical],['仅项目名不同',s.sameByRename],
    ['相似(漂移)',s.similar],['差异较大',s.diverged],
    ['仅 '+NAME_A,s.onlyA],['仅 '+NAME_B,s.onlyB]
  ];
  document.getElementById('cards').innerHTML=items.map(([l,n])=>
    '<div class="card"><div class="num">'+n+'</div><div class="label">'+esc(l)+'</div></div>').join('');
  document.getElementById('thA').textContent=NAME_A;
  document.getElementById('thB').textContent=NAME_B;
  document.getElementById('meta').textContent=
    NAME_A+' ('+DATA.meta.dirA+')  ↔  '+NAME_B+' ('+DATA.meta.dirB+')    生成：'+DATA.meta.generatedAt+
    (DATA.meta.excludePatterns&&DATA.meta.excludePatterns.length
      ? '    已排除 '+DATA.meta.excludedCount+' 个文件：'+DATA.meta.excludePatterns.join(' , ') : '');
})();

render();
</script>
</body>
</html>
